[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "early-sepsis-prediction"
version = "0.1.0"
description = "Early sepsis warning system for ICU patients, with a production-style retraining/inference stack; the Sepsyd CinC 2019 baseline reproduction is one step in that pipeline."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*", "app*", "scripts*"]
